server:
  port: 7072
spring:
  application:
    name: oauth2-service
  datasource:
    url: jdbc:h2:file:./data/oauth2db
    username: sa
    password: ""
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

logging:
  level:
    org.springframework.security: DEBUG
